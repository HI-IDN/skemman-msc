project:
  type: book
  output-dir: site
  resources:
    - .nojekyll
    # Anchored with a leading slash. Unanchored, the pattern matches img/hi at
    # any depth, and pulls in skemman-harvester/docs/img/hi as well.
    - /img/hi

bibliography: references.bib

book:
  title: "Meistararitgerðir í verkfræði og tæknigreinum"
  repo-url: https://github.com/HI-IDN/icelandic-thesis-comparison
  repo-actions: [edit, issue]
  site-url: https://hi-idn.github.io/icelandic-thesis-comparison
  favicon: img/hi/favicon.svg
  search: true
  page-footer:
    left: "© 2026 Háskóli Íslands"
    center: "Dr. Helga Ingimundardóttir"
    right:
      - icon: github
        href: https://github.com/HI-IDN/icelandic-thesis-comparison
        aria-label: GitHub
  navbar:
    logo: img/hi/hi_named_logo-is.svg
    logo-alt: "Háskóli Íslands"
    background: primary
    tools:
      - icon: github
        href: https://github.com/HI-IDN/icelandic-thesis-comparison
        aria-label: GitHub
  sidebar:
    style: docked
    background: light
  chapters:
    - index.qmd
    - docs/01-rq1-volume.qmd
    - docs/02-rq2-disciplines.qmd
    - docs/03-rq3-comparison.qmd
    - docs/04-rq4-collaboration.qmd
    - docs/05-rq5-partners.qmd
    - docs/06-rq6-themes.qmd
    - docs/07-rq7-knowledge-transfer.qmd
    - docs/08-verkfraedingsleyfi.qmd
    - docs/09-tengslanet.qmd
  appendices:
    - docs/vidauki-adferd.qmd
    - docs/schema.qmd

# Quarto's built-in strings are English; the book is Icelandic. Only the ones
# that actually surface in the rendered page are overridden here.
language:
  section-title-appendices: "Viðauki"
  toc-title-document: "Efnisyfirlit"
  toc-title-website: "Á þessari síðu"
  back-to-top: "Efst á síðu"
  search-text-placeholder: "Leita"
  repo-action-links-edit: "Breyta þessari síðu"
  repo-action-links-issue: "Tilkynna villu"
  repo-action-links-source: "Skoða frumkóða"
  copy-button-tooltip: "Afrita"
  copy-button-tooltip-success: "Afritað!"
  search-no-results-text: "Engar niðurstöður"
  crossref-apx-prefix: "Viðauki"
  crossref-ch-prefix: "Kafli"
  crossref-sec-prefix: "Hluti"
  crossref-fig-title: "Mynd"
  crossref-tbl-title: "Tafla"

format:
  html:
    theme:
      - cosmo
      - styles/hi-book.scss
    include-in-header: partials/header-includes.inc
    include-after-body:
      - partials/breadcrumb.inc
      - partials/sortable.inc
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Sýna kóðann"
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    fig-width: 9
    fig-height: 5.5
    embed-resources: false

# No freeze: the book is rendered locally, where R and thesis.db are available,
# so every chunk executes against the live database on each render.
execute:
  echo: true
  warning: false
  message: false
