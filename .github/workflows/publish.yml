name: Publish book

# Manual only. The book is rendered locally, where R and thesis.db are
# available; there is no _freeze cache for CI to build from, so an automatic
# push trigger would fail on every commit. Re-enable the push trigger once
# either the freeze cache or a committed database snapshot exists (see issue #3).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the book can be built here
        run: |
          if [ ! -d _freeze ]; then
            echo "::error::_freeze/ is missing and this runner has neither R nor thesis.db,"
            echo "::error::so no chunk can be executed. This workflow is manual-only for that"
            echo "::error::reason -- see issue #3. To publish, either commit a _freeze cache or"
            echo "::error::add R and a database snapshot to this job."
            exit 1
          fi

      - uses: quarto-dev/quarto-actions/setup@v2

      # No R and no database here on purpose: every chunk is served from _freeze/,
      # which is committed. Renders that need fresh data must be run locally.
      - name: Render book
        run: quarto render --no-execute-daemon

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
