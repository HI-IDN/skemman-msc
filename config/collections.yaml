# Skemman harvester settings.
base_url: "https://skemman.is"
user_agent: "skemman-harvester/1.1 research crawler; contact: helgaingim@hi.is"
# skemman.is/robots.txt asks for Crawl-delay: 30. The earlier value of 2 was
# set before anyone read it.
request_delay_seconds: 30
# Theses run to hundreds of megabytes and Skemman serves the large ones
# slowly. This is a per-read timeout, not a total.
timeout_seconds: 120

record_limit: 10000
titlepage_pages: 20

# Theses where I am author or advisor, so I know what the title page says and
# can see straight away when the parser reads it wrong. Used by `--test`.
#
#   25337  author, PhD, 265 pp. -- one PDF, open
#    4445  author, MSc, 94 pp. -- one PDF, open
#   50278  advisor -- two PDFs, the declaration is the smaller one
#   50249  advisor -- full text embargoed until 2050, never fetchable
#   53215  advisor -- two PDFs, the declaration is the larger one
test_ids: [25337, 4445, 50278, 50249, 53215]

handles:
  HI: "1946/2064"
  HR: "1946/6870"

# What each collection holds, where Skemman's dc:type does not say it. Every
# record filed in a collection listed with a `type` is that type; every other
# record is a Thesis, and its level is degree_level. `degree` fills
# degree_level where dc:type names none: the doctoral collections file some
# theses as "Book". Keys are collection handles, the number in its URL.
collections:
  "1946/2178": {type: Report}    # Rannsóknarverkefni - Verkfræði- og náttúruvísindasvið
  "1946/9907": {type: Report}    # Skýrslur - Verkfræði- og náttúruvísindasvið
  "1946/7633": {type: Article}   # Rit starfsmanna - Verkfræði- og náttúruvísindasvið
  "1946/2105": {degree: phd}     # Doktorsritgerðir - Verkfræði- og náttúruvísindasvið
  "1946/12147": {degree: phd}    # PhD (-2016) - HR Tæknisvið
  "1946/4444": {degree: phd}     # Doktorsritgerðir - Auðlindadeild, LbhÍ

# What the analysis counts. The harvest takes every year Skemman has; these
# choose which of them the population covers -- v_thesis_msc, built by
# scripts/population.sql in the postprocessing step -- and with it every figure
# and table in the book.
analysis:
  year_start: 2010
  year_end: 2026
  # The whole years. 2010-2011 are not whole years in the data, and the final
  # year is still arriving, so shares and seasonal patterns use only these.
  stable_start: 2012
  stable_end: 2025
