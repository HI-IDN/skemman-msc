# Outside organisations named in thesis front matter, for scripts/load_collaboration.py (#11).
#
# Seeded from the names that recur in the acknowledgements and prefaces of engineering
# master's theses, not from a list of Icelandic companies: an organisation is here because
# theses name it. Anything not listed is still caught, less precisely, by the company-suffix
# and wording signals, and later by the LLM step (#12).
#
# key          stable identifier, used in the database
# name         matched literally, as a whole word, case-sensitively
# aliases      regular expressions, also whole-word and case-sensitive -- Icelandic case
#              endings ("Eflu", "Vegagerðinni") and English names go here
# sector       private         privately owned company
#              public_company  company owned by the state or a municipality (ohf., sf.,
#                              or a subsidiary of one) -- kept apart from private because
#                              the largest partners are of this kind
#              public_agency   government agency, ministry, municipality, or state institute
#              research_fund   a fund that awards grants, whoever owns it
#              university      a university, university programme or academic research centre
#              international   EU, UN and other multinational bodies and programmes
# external     false for the two universities' own units and funds; default true
#
# Order matters where two names start at the same place: the entry listed first wins. The
# funds come first so "Landsvirkjun Energy Research Fund" is the fund, not "Landsvirkjun"
# followed by stray words. A name inside a longer one that starts earlier -- "Landsvirkjunar"
# in "Orkurannsóknasjóður Landsvirkjunar" -- is never matched separately.

organisations:

  # --- funds ---------------------------------------------------------------------------
  - {key: rannis, name: Rannís, aliases: ['RANN[IÍ]S', 'Rannis', 'Icelandic Centre for Research', 'Rannsóknamiðstöð(?:var)? Íslands'], sector: research_fund}
  - {key: irf, name: Icelandic Research Fund, aliases: ['Rannsóknar?sjóð(?:ur|i|s)(?! Háskóla| Vegagerðar| Landsvirkj)'], sector: research_fund}
  - {key: tds, name: Technology Development Fund, aliases: ['Tækniþróunarsjóð(?:ur|i|s)'], sector: research_fund}
  - {key: lv_fund, name: Landsvirkjun Energy Research Fund, aliases: ["Landsvirkjun(?:'s)? Energy Research Fund", 'Orkurannsóknar?sjóð(?:ur|i|s) Landsvirkjunar'], sector: research_fund}
  - {key: vor, name: VOR, aliases: ['VOR[ -]Reykjav[ií]k Energy (?:Environmental and Energy )?Research Fund', 'Reykjav[ií]k Energy (?:Environmental and Energy )?Research Fund', 'Vísinda- og rannsóknar?sjóð(?:ur|i|s) (?:Orkuveitu Reykjavíkur|OR)'], sector: research_fund}
  - {key: vegagerdin_fund, name: Rannsóknasjóður Vegagerðarinnar, aliases: ['Rannsóknar?sjóð(?:ur|i|s) Vegagerðarinnar', 'Road (?:Administration )?Research Fund'], sector: research_fund}
  - {key: hi_fund, name: University of Iceland Research Fund, aliases: ['Rannsóknar?sjóð(?:ur|i|s) Háskóla Íslands'], sector: research_fund, external: false}

